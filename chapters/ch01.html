<!-- ====================== ① 觀念解說 ====================== -->
<template id="tpl-concept">
  <h3>一、密度是「強度性質」：跟你拿多少無關</h3>
  <p>
    上面的盒子做了一件課本畫不出來的事：<strong>把「單位晶胞數」從 2 拉到 6</strong>（原子數從幾十顆變成幾百顆），
    你會看到原子數與質量一起變大，但「算出的密度」那格數字<strong>一位小數都不會動</strong>。
    質量與體積都是<em>外延性質</em>（extensive，跟量有關），兩者相除得到的密度則是
    <em>強度性質</em>（intensive，跟量無關）。這就是為什麼密度可以拿來辨識物質。
  </p>

  <h4>二、原子怎麼堆，決定了密度</h4>
  <p>
    同樣是金屬原子，堆法不一樣，單位體積裝得下的原子數就不一樣：
  </p>
  <ul>
    <li><strong>面心立方 FCC</strong>（Au、Al）：每個單位晶胞含 4 顆原子，<span data-term="堆積因子">堆積因子</span> APF = 0.74，是最密堆積。</li>
    <li><strong>體心立方 BCC</strong>（α-Fe）：每個晶胞含 2 顆原子，APF = 0.68，比較鬆。</li>
    <li><strong>六方最密堆積 HCP</strong>（Ti）：APF 同樣是 0.74，但層序是 ABAB 而非 FCC 的 ABCABC。</li>
  </ul>
  <p>
    切換 Au 與 Al 特別有感：兩者都是 FCC、晶格常數也差不多（407.8 pm 對 405.0 pm），
    盒子裡的原子數幾乎一樣，<strong>可是金的密度是鋁的 7 倍</strong>——差別完全來自原子量（196.97 對 26.98）。
    密度不是「原子擠不擠」單一因素決定的，而是<em>原子量</em>與<em>堆積方式</em>兩件事的乘積。
  </p>

  <div class="formula teacher-only">
    <strong>教師模式：立方晶系的理論密度</strong><br>
    <code>ρ = Z · M / (N<sub>A</sub> · a³)</code><br>
    Z = 單位晶胞內的原子數（FCC 為 4、BCC 為 2）；M = 原子量 (g/mol)；a = 晶格常數 (cm)；
    N<sub>A</sub> = 6.022×10²³ /mol。<br>
    六方最密堆積：<code>V<sub>cell</sub> = (3√3 / 2) · a² · c</code>，Z = 6。<br>
    以金為例：ρ = 4 × 196.97 / (6.022×10²³ × (4.078×10⁻⁸ cm)³) = 19.3 g/cm³，與文獻值一致。
  </div>

  <h4>三、精密度不等於準確度</h4>
  <p>
    下方的射靶把兩件常被混為一談的事分開：
  </p>
  <ul>
    <li><span data-term="準確度">準確度</span>（accuracy）＝ 平均值離真值多近。偏掉通常代表<strong>系統誤差</strong>：天平沒歸零、量瓶沒校正、讀數視差。</li>
    <li><span data-term="精密度">精密度</span>（precision）＝ 重複量測彼此有多集中，用<span data-term="標準差">標準差</span> s 描述。散得開通常代表<strong>隨機誤差</strong>。</li>
  </ul>
  <p>
    按「高精密 · 低準確」那顆按鈕，你會看到一群點緊緊靠在一起、卻整團偏離紅心——
    這在實驗室最危險，因為數據「看起來很漂亮」，卻是錯的。
    系統誤差只能靠<strong>校正與標準品</strong>解決，多做幾次是沒有用的。
  </p>

  <div class="note">
    <strong>有效數字提醒：</strong>密度的計算結果不會比你輸入的數據更精確。
    量到 2.70 g/cm³（三位有效數字）就不能寫成 2.70000。
  </div>
</template>

<!-- ====================== ② 綠色化學／在地連結 ====================== -->
<template id="tpl-green">
  <h3>從「多重」到「多少碳」：密度的永續版本</h3>
  <p>
    在課本裡，密度是拿來算質量的。在真實世界，密度是<strong>減碳的槓桿</strong>。
    交通運輸約占全球能源相關 CO₂ 排放的四分之一，而車輛在使用階段燒掉的油，
    有很大一部分是拿來搬動<em>車子自己的重量</em>。
  </p>

  <h4>🌿 綠色情境怎麼玩</h4>
  <p>
    切到「綠色化學情境」後，畫面上四個<strong>體積完全相同</strong>的方塊代表四種車體材料，
    上方柱子的高度就是它們的質量比。請你依序試三件事：
  </p>
  <ol>
    <li>把材料從「鋼」換成「碳纖維複材」，看「相對鋼材減重」跳到多少 kg。</li>
    <li>拉「年行駛里程」到 30,000 km，看使用階段的年減碳怎麼放大。</li>
    <li><strong>然後把年行駛里程降到 3,000 km、使用年限降到 5 年</strong>——你會看到「全生命週期淨減碳」翻成負值。</li>
  </ol>
  <div class="note warn">
    第 3 步是本章最重要的一課：<strong>輕的材料不一定比較綠</strong>。
    鋁、鎂、碳纖維的製造隱含碳都比鋼高出好幾倍，必須「開得夠久」才把製造階段多花的碳賺回來。
    這就是<em>生命週期思考</em>（Life Cycle Thinking）——只看單一階段會做出錯誤的環境決策。
    把「再生料比例」拉到 100%，你會看到這個門檻立刻降低：再生鋁的隱含碳大約只有原生鋁的 5–10%。
  </div>

  <h4>對應的綠色化學原則</h4>
  <ul>
    <li><strong>原則 #11 即時分析防污染</strong>：射靶模組講的正是這件事。要在製程中「即時」判斷一批物料合不合格，
      前提是量測方法既<span data-term="準確度">準確</span>又<span data-term="精密度">精密</span>；
      量不準，就只能等到污染發生後才知道。</li>
    <li><strong>原則 #6 能源效率設計</strong>：減重直接減少使用階段的能源需求。</li>
    <li><strong>原則 #1 預防廢棄物</strong>：再生料的使用把「廢棄物」重新變回「原料」。</li>
  </ul>

  <h4>🏞 花蓮在地連結</h4>
  <p><strong>（一）大理石與蛇紋石的密度量測</strong></p>
  <p>
    花蓮是台灣大理岩（密度約 2.60–2.80 g/cm³）與蛇紋岩（約 2.50–2.60 g/cm³）的主要產地。
    這兩種岩石的密度差距不到 10%，正好是「精密度不夠就分不出來」的實例——
    用排水法量體積時，若量筒讀數的隨機誤差達 ±0.5 mL，就足以讓兩者的判別失效。
  </p>
  <p><strong>（二）礦業廢石不是廢物：蛇紋石碳礦化</strong></p>
  <p>
    開採大理石會產生大量廢石與細粉。其中的蛇紋石富含鎂矽酸鹽，可以和 CO₂ 反應生成穩定的碳酸鎂，
    把二氧化碳「鎖」進岩石裡（礦物碳封存，mineral carbonation）：
  </p>
  <div class="formula">
    <code>Mg₂SiO₄ (鎂橄欖石/蛇紋石風化產物) + 2 CO₂ → 2 MgCO₃ + SiO₂</code><br>
    這是自然界風化作用的加速版；產物 MgCO₃ 在地質尺度上是穩定的，不像地下封存有洩漏疑慮。
    <span class="teacher-only">教師補充：反應為放熱（每莫耳 CO₂ 約 −60 至 −90 kJ），限制因素是動力學而非熱力學，
    因此研究重點在提高反應速率（研磨細度、溫度、pH 調控），這一點會在 Ch12 動力學再遇到。</span>
  </div>
  <p>
    對花蓮而言，這代表礦業廢石有機會從「環境負債」轉成「碳匯資源」——
    而要評估一噸廢石到底能固定多少 CO₂，第一步就是準確量出它的<strong>密度與鎂含量</strong>。
    這一章的兩個模組，其實就是這件事的入門。
  </p>

  <div class="note leaf">
    <strong>本章綠色化學占比自評：</strong>綠色情境為完整可互動模擬（5 個可調參數）；

  </div>
</template>

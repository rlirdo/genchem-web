<template id="tpl-concept">
  <h3>一、限量試劑：誰先用完，誰說了算</h3>
  <p>
    化學計量最容易被記成「背係數」，但它真正的意思是<strong>配額</strong>。
    N₂ + 3H₂ → 2NH₃ 這條式子在說：每消耗 1 個 N₂ 就要配 3 個 H₂。
    所以判斷誰是<span data-term="限量試劑">限量試劑</span>不能只看「哪個比較少」，
    而要看<strong>「莫耳數 ÷ 係數」誰比較小</strong>。
  </p>
  <div class="formula">
    <code>可反應次數 = min( n(N₂) / 1 , n(H₂) / 3 )</code><br>
    例：投入 6 個 N₂ 與 6 個 H₂ → 6/1 = 6、6/3 = 2 → 只能反應 2 次。
    <strong>H₂ 才是限量試劑</strong>，雖然兩者「個數一樣多」。
  </div>
  <p>
    上面的反應器把這件事畫出來了：按「開始反應」之後，紅色標記的就是限量試劑，
    灰色半透明的分子則是<strong>過量剩餘</strong>——在真實工廠裡，這些剩下來的東西要嘛回收、要嘛變成廢棄物，
    兩者的成本差很多。
  </p>

  <h4>二、莫耳：從「數不到」到「秤得到」</h4>
  <p>
    右邊表格的單位寫的是「分子個數」，但整張表乘上 <span data-term="莫耳">亞佛加厥數</span> 6.022×10²³ 之後完全不變形——
    這就是莫耳的用處：<strong>比例關係在微觀與巨觀之間是等價的</strong>。
    實驗室秤 17.03 g 的 NH₃，就是秤了 1 莫耳、6.022×10²³ 個氨分子。
  </p>

  <h4>三、質量守恆是檢查表，不是口號</h4>
  <p>
    面板上的「質量守恆檢查」會把反應前後所有物種的總質量（原子質量單位 u）算出來。
    不管你怎麼調分子數、反應幾次，這個數字都不會變。
    如果你自己算計量題時前後對不起來，那一定是配平或係數出了問題。
  </p>
  <div class="formula teacher-only">
    <strong>教師模式：本頁用到的關係式</strong><br>
    可反應次數 <code>ξ = ⌊min(n_i / ν_i)⌋</code>（ν 為計量係數）<br>
    剩餘量 <code>n_i,after = n_i − ξ·ν_i</code>；產物量 <code>n_j = ξ·ν_j</code><br>
    分子量由 <code>assets/data/constants.js</code> 的 <code>ATOMIC_MASS</code> 逐原子加總，
    要改原子量請改那個檔案。
  </div>
</template>

<template id="tpl-green">
  <h3>產率高，不代表沒有浪費</h3>
  <p>
    傳統有機化學課只問一件事：<strong>產率（yield）多少？</strong>
    但產率 90% 的反應，可能同時把 60% 的原料原子丟進廢液桶——因為那些原子從一開始就沒打算進到產物裡
    （保護基、離去基、化學計量的助劑）。
    <span data-term="原子經濟性">原子經濟性</span>問的是完全不同的問題：
  </p>
  <div class="formula">
    <code>原子經濟性 AE = 目標產物分子量 ÷ 所有反應物分子量總和 × 100%</code><br>
    <code>E-factor = 廢棄物質量 ÷ 產物質量</code>
  </div>

  <h4>🌿 綠色情境怎麼玩：布洛芬的兩條路</h4>
  <p>
    布洛芬（ibuprofen，就是市售止痛藥的主成分）是綠色化學教科書最經典的案例，因為同一個分子有兩條工業化路線：
  </p>
  <div class="compare">
    <div class="c-old">
      <h5>🏭 Boots 傳統路線（1960s，6 步）</h5>
      <ul>
        <li>原子經濟性僅 <strong>40.0%</strong></li>
        <li>使用<strong>化學計量</strong>的 AlCl₃，用完即水解成廢鋁鹽</li>
        <li>步驟多 → 每一步都要分離純化 → 溶劑與能源疊加</li>
        <li>超過一半的原料原子最後變成廢棄物</li>
      </ul>
    </div>
    <div class="c-new">
      <h5>🌿 BHC 觸媒路線（1990s，3 步）</h5>
      <ul>
        <li>原子經濟性 <strong>77.4%</strong>；回收乙酸後可達 <strong>99.0%</strong></li>
        <li>把化學計量試劑換成<span data-term="催化劑">催化劑</span>（HF、Raney Ni、Pd）</li>
        <li>步驟由 6 步降為 3 步，分離次數與能耗同步下降</li>
        <li>唯一副產物是乙酸，而且可以回收再賣</li>
        <li>1997 年美國總統綠色化學挑戰獎得主</li>
      </ul>
    </div>
  </div>
  <p>
    請在控制面板依序做三件事：<strong>①</strong> 切到 BHC 路線看「產生廢棄物」掉多少；
    <strong>②</strong> 勾選「回收副產物乙酸」，看原子經濟性衝到 99%；
    <strong>③</strong> 把「廢棄物處理成本」拉高到 120 元/kg——你會發現綠色化學不只是道德議題，
    它同時是<strong>成本議題</strong>，這也是它真的被工業界採用的原因。
  </p>

  <h4>對應的綠色化學原則</h4>
  <ul>
    <li><strong>原則 #1 預防廢棄物</strong>：與其事後處理廢液，不如一開始就設計不產生它的路徑。</li>
    <li><strong>原則 #2 原子經濟性</strong>：本章的核心指標。</li>
    <li><strong>原則 #8 減少衍生物</strong>：Boots 路線的多餘步驟正是「衍生物」的典型——
      保護、去保護、官能基轉換，每一步都消耗試劑卻不增加最終產物的原子。</li>
  </ul>

  <h4>📏 E-factor：不同產業差了三個數量級</h4>
  <p>Roger Sheldon 統計各產業每做 1 kg 產品產生的廢棄物：</p>
  <table class="data">
    <thead><tr><th>產業</th><th>E-factor 範圍</th><th>年產量級距</th></tr></thead>
    <tbody>
      <tr><td>石化業</td><td>約 0.1（有些低於 0.1）</td><td>10⁶–10⁸ 噸</td></tr>
      <tr><td>大宗化學品</td><td>1 – 5</td><td>10⁴–10⁶ 噸</td></tr>
      <tr><td>精細化學品</td><td>5 – 50</td><td>10²–10⁴ 噸</td></tr>
      <tr><td>製藥業</td><td>25 – 100</td><td>10 – 10³ 噸</td></tr>
    </tbody>
  </table>
  <p style="margin-top:.6rem">
    看起來石化業最「乾淨」？別急——它的<strong>總量</strong>大到即使 E-factor 只有 0.1，
    絕對廢棄量仍然驚人。這提醒我們：綠色指標要同時看「強度」與「總量」。
  </p>

  <h4>🏞 在地連結：合成氨與花蓮的農業</h4>
  <p>
    切回傳統情境選 N₂ + 3H₂，你會看到儀表板顯示原子經濟性 <strong>100%</strong>——
    每一顆氮原子與氫原子都進到 NH₃ 裡，沒有任何副產物。就原子經濟性而言，這是完美的反應。
  </p>
  <div class="note warn">
    但哈柏法在 450 °C、200 atm 下運轉，約占全球能源使用的 1–2%，每噸氨排放約 1.9 噸 CO₂。
    <strong>原子經濟性 100% 的反應，仍然可以是高碳排的反應。</strong>
    這是全書最重要的觀念之一：綠色化學的十二條原則要一起看，不能只挑一條漂亮的來講。
    這條線索會在 Ch13 的「哈柏法 vs 固氮酶」接上。
  </div>
  <p>
    花蓮的有機農業選擇不使用合成氮肥，改以豆科綠肥（透過根瘤菌的<span data-term="固氮酶">固氮酶</span>常溫固氮）
    與堆肥補充氮素——這其實是用生物體系取代高溫高壓製程，也就是原則 #6 與 #9 的實踐。
  </p>

  <div class="note leaf">
    <strong>本章綠色化學占比自評：</strong>本章為綠色化學核心章。綠色情境為完整可互動計算器（4 個可調參數）；
    綠色相關文字實測占全章 66.5%（觀念解說 656 字 vs 綠色化學 1304 字）；5 題測驗中有 4 題考綠色化學判斷。
  </div>
</template>

<template id="tpl-concept">
  <h3>一、溶解不是「消失」，是被水拆開又抱住</h3>
  <p>
    把「時間軸」滑桿從 0% 慢慢推到 100%，你會看到 NaCl 晶體的離子被一顆一顆拉走。
    請注意<strong>先走的一定是角落的離子</strong>——因為角落離子的配位數最少，被晶格抓得最鬆。
    這不是動畫效果，這是真實的溶解機制。
  </p>
  <p>
    水能做到這件事，靠的是它的<strong>偶極</strong>：氧端帶部分負電、氫端帶部分正電。
    於是水分子用氧端圍住 Na⁺、用氫端圍住 Cl⁻，把離子從晶格上「談判」下來，
    再穩定地包在水殼裡——這個過程叫<span data-term="水合">水合</span>。
  </p>
  <div class="note">
    把滑桿<strong>拉回去</strong>試試看：離子會回到晶格上。這就是重結晶。
    溶解與結晶其實一直同時在進行，飽和溶液只是兩者速率相等的<span data-term="動態平衡">動態平衡</span>——
    這條線索會在 Ch13 全面展開。
  </div>

  <h4>二、沉澱：什麼時候「不肯」溶在水裡</h4>
  <p>
    切到「模組 B」，自己搭配陽離子與陰離子。有些組合什麼都不會發生（例如 Na⁺ + NO₃⁻），
    有些一碰面就變濁（例如 Ag⁺ + Cl⁻）。判斷的依據是<span data-term="溶解度積">溶解度積</span> Ksp：
  </p>
  <div class="formula">
    <code>AgCl(s) ⇌ Ag⁺(aq) + Cl⁻(aq)　　Ksp = [Ag⁺][Cl⁻] = 1.8×10⁻¹⁰</code><br>
    把當下的離子濃度代進去得到<span data-term="反應商">反應商</span> Q：<br>
    <code>Q &gt; Ksp → 沉澱析出　　Q = Ksp → 飽和　　Q &lt; Ksp → 繼續溶解</code>
  </div>

  <h4>三、淨離子方程式：把不做事的人請出去</h4>
  <p>
    當你把 AgNO₃ 溶液倒進 NaCl 溶液，實際發生的只有 Ag⁺ 與 Cl⁻ 結合成固體。
    Na⁺ 與 NO₃⁻ 從頭到尾都泡在水裡沒事做——它們是<span data-term="旁觀離子">旁觀離子</span>。
    把它們刪掉，剩下的就是<span data-term="淨離子方程式">淨離子方程式</span>：
  </p>
  <div class="formula">
    完整式：<code>AgNO₃(aq) + NaCl(aq) → AgCl(s) + NaNO₃(aq)</code><br>
    淨離子式：<code>Ag⁺(aq) + Cl⁻(aq) → AgCl(s)</code><br>
    <span class="teacher-only">教師補充：這個化簡不是為了偷懶，而是為了看清「真正的反應」是什麼。
    在廢水處理的場合，這決定了你該加哪一種藥劑。</span>
  </div>
</template>

<template id="tpl-green">
  <h3>同一個 Ksp，換一個舞台：重金屬廢水處理</h3>
  <p>
    上一段你用 Ksp 判斷 AgCl 會不會沉澱。現在把同一件事拿去做環境工程——
    差別只在於，這次我們<strong>刻意</strong>讓金屬離子沉澱，好把它從水裡撈出來。
  </p>
  <div class="formula">
    <code>Pb²⁺(aq) + 2 OH⁻(aq) → Pb(OH)₂(s)↓</code>
    <code>殘留 [Pb²⁺] = Ksp / [OH⁻]²</code><br>
    pH 每上升 1，[OH⁻] 上升 10 倍，殘留濃度就下降 100 倍。
  </div>

  <h4>🌿 綠色情境怎麼玩：三個一定要做的實驗</h4>
  <ol>
    <li><strong>選「鎘 Cd²⁺」，把 pH 從 8 慢慢往上拉。</strong>你會看到殘留濃度一路往下掉，
      直到跨過那條紅色的放流水標準線（0.03 mg/L，是三種金屬中最嚴的）。</li>
    <li><strong>選「鉛 Pb²⁺」，把 pH 拉超過 11。</strong>曲線會<strong>翹回來</strong>！
      因為鉛是<span data-term="兩性">兩性</span>金屬，高 pH 時生成可溶的 Pb(OH)₃⁻ 又溶回水裡。
      這是實務上最常見的操作錯誤之一：<strong>加越多鹼不等於越乾淨。</strong></li>
    <li><strong>切到「硫化物法」。</strong>殘留濃度會再掉好幾個數量級——因為 PbS 的 Ksp 只有 10⁻²⁸ 量級。
      但看一下儀表板上的「藥劑毒性等級」，它從 1.2 跳到 4.0。</li>
  </ol>
  <div class="note warn">
    第 3 個實驗是本章最重要的一課。硫化物法能把水處理得更乾淨，
    但硫化物藥劑本身有毒，遇酸會放出劇毒的 H₂S。
    <strong>「處理得更乾淨」與「製程本身更安全」是兩件不同的事。</strong>
    綠色化學要求同時看這兩件事（原則 #3 低毒性、原則 #12 本質安全），而不是只看放流水數據。
  </div>

  <h4>對應的綠色化學原則</h4>
  <ul>
    <li><strong>原則 #5 更安全的溶劑與助劑</strong>：這一整章的反應都在<strong>水</strong>裡進行。
      水無毒、不可燃、不揮發、可回收，是綠色化學最推薦的溶劑。</li>
    <li><strong>原則 #3 低毒性合成</strong>：氫氧化物法（石灰、NaOH）vs 硫化物法的取捨。</li>
    <li><strong>原則 #1 預防廢棄物</strong>：加藥最佳化。看儀表板的「污泥產量」——
      加藥量從 1.0 拉到 5.0 倍，殘留濃度改善有限，污泥卻直線上升。
      這些污泥是<strong>事業廢棄物</strong>，處理費用高、而且只是把污染從水相移到固相。</li>
  </ul>

  <h4>更前面一步：源頭減量與資源回收</h4>
  <p>
    沉澱法終究是「末端處理」。真正符合綠色化學精神的順序是：
  </p>
  <ol>
    <li><strong>源頭替代</strong>：電鍍改用三價鉻取代六價鉻、無鉛焊料取代含鉛焊料。</li>
    <li><strong>製程內回收</strong>：離子交換、電解回收，把金屬直接變回原料（呼應 Ch2 的都市採礦）。</li>
    <li><strong>末端處理</strong>：才輪到今天玩的沉澱法。</li>
  </ol>

  <h4>🏞 在地連結：花蓮溪流域的水質</h4>
  <p>
    花蓮的水環境同時承受三種壓力：<strong>農業排水</strong>（氮、磷、農藥殘留）、
    <strong>礦業與砂石加工</strong>（懸浮固體、少量重金屬）與<strong>生活污水</strong>。
    這三者需要的化學處理完全不同：
  </p>
  <ul>
    <li>農業排水的氮磷 → 生物處理與人工濕地（利用微生物的硝化—脫氮），不是沉澱法。</li>
    <li>懸浮固體 → 混凝沉澱（加鋁鹽或鐵鹽），原理是壓縮膠體的雙電層。</li>
    <li>重金屬 → 才是今天這一頁的 pH 調整＋沉澱。</li>
  </ul>
  <p>
    這件事的化學意義是：<strong>「污染」不是單一問題，開藥方之前要先知道對象是誰。</strong>
    而要知道對象是誰，就得回到 Ch2 講過的原則 #11——先有可靠的分析。
  </p>
  <p>
    花蓮的另一個特色是水質相對乾淨、水量豐沛，這讓「人工濕地」這類低能耗的自然解方特別可行。
    用生態系統代替加藥槽，本質上就是原則 #6（能源效率）與原則 #9（生物催化）的組合。
  </p>

  <div class="note leaf">
    <strong>本章綠色化學占比自評：</strong>綠色情境為完整可互動模擬（5 個可調參數，含 U 型溶解度曲線）；

  </div>
</template>

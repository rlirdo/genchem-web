<template id="tpl-concept">
  <h3>一、軌域不是軌道</h3>
  <p>
    高中課本常畫的「電子繞著核跑」的圖是波耳模型，它在氫原子上算得出正確的能階，
    但<strong>電子的位置並不是一條線</strong>。解薛丁格方程式得到的是波函數 ψ，
    而 |ψ|² 代表「在某一點找到電子的機率密度」。
  </p>
  <p>
    上面 3D 畫面裡的每一個點，都是依 |ψ|² 抽樣出來的一次「找到電子」的事件。
    點密的地方機率高，點稀的地方機率低——這就是<span data-term="軌域">軌域</span>的真正意思。
  </p>
  <div class="note">
    <strong>顏色代表什麼？</strong>藍色是 ψ &gt; 0 的區域，橘色是 ψ &lt; 0。
    請注意：機率 |ψ|² 在兩邊都是正的，<strong>正負號指的是波函數的相位</strong>。
    這個相位在 Ch8 會變得非常重要——同相疊加形成鍵結軌域，反相疊加形成反鍵軌域。
  </div>

  <h4>二、節面：電子絕對不會出現的地方</h4>
  <p>
    勾選「顯示節面與節球」，黃色的曲面就是<span data-term="節面">節面</span>——ψ = 0 的位置。
    它們分兩種：
  </p>
  <ul>
    <li><strong>徑向節面（節球）</strong>：像洋蔥皮一樣的球殼。數量 = n − ℓ − 1。
      切到 3s 會看到<strong>兩層</strong>球殼。</li>
    <li><strong>角向節面</strong>：通過原子核的平面或錐面。數量 = ℓ。
      2p 有 1 個平面；3d_xy 有 2 個平面；3d_z² 則是兩個<strong>錐面</strong>（54.7° 與 125.3°）。</li>
  </ul>
  <div class="formula">
    <code>總節面數 = n − 1</code>　（徑向 n − ℓ − 1 個 ＋ 角向 ℓ 個）<br>
    例：3p_z 的 n = 3、ℓ = 1 → 徑向 1 個節球 + 角向 1 個節面 = 共 2 個。<br>
    <span class="teacher-only">教師補充：本頁使用類氫（單電子）波函數。多電子原子因電子—電子排斥而使
    軌域能量分裂（同一 n 下 s &lt; p &lt; d &lt; f），形狀也會略為收縮，但節面的數目規則不變。</span>
  </div>

  <h4>三、週期趨勢：從軌域讀出整張週期表</h4>
  <p>
    下方的互動週期表點任一元素，就會顯示它的電子組態，並在趨勢圖上標出位置。請觀察兩件事：
  </p>
  <ul>
    <li><strong>游離能</strong>（紅點為惰性氣體、黃點為鹼金屬）：
      每一個週期結束時衝到高峰，下一個週期開始時掉到谷底。
      這個鋸齒形狀本身就是「電子殼層存在」的直接證據。</li>
    <li><strong>共價半徑</strong>：同一週期由左至右變小（核電荷增加、電子被拉得更緊），
      同一族由上而下變大（多了一層電子殼層）。</li>
  </ul>
  <p>
    順帶一提：週期表上的<strong>例外</strong>也值得看。點鉻（Cr，Z = 24）與銅（Cu，Z = 29），
    它們的組態是 3d⁵4s¹ 與 3d¹⁰4s¹ 而不是規則的 3d⁴4s² 與 3d⁹4s²——
    半滿與全滿的 d 殼層特別穩定。
  </p>

<template id="tpl-green">
  <h3>能隙：一個量子力學參數，決定整個能源產業</h3>
  <p>
    軌域與能階聽起來很抽象，但當原子聚成固體，離散的能階會展開成<strong>能帶</strong>，
    價帶與導帶之間的空隙就是<span data-term="能隙">能隙</span> E_g。
    這一個數字決定了材料能吸收哪些光、能發出哪些光，也就決定了太陽能電池與 LED 的一切。
  </p>
  <div class="formula">
    <code>λ = 1239.84 / E_g</code>　（E_g 以 eV 為單位，λ 以 nm 為單位）<br>
    能隙 3.20 eV（TiO₂）→ 387 nm，只吃得到紫外光。<br>
    能隙 1.12 eV（Si）→ 1107 nm，可以吸收整個可見光加一部分紅外光。
  </div>

  <h4>🌿 綠色情境怎麼玩</h4>
  <ol>
    <li>依序點過六種光電材料，看「理論轉換上限」怎麼變。
      你會發現最高點落在能隙約 <strong>1.34 eV</strong> 附近——這就是
      <strong>Shockley–Queisser 極限</strong>（單接面太陽能電池的理論上限 33.7%）。</li>
    <li>點 <strong>TiO₂</strong>（3.20 eV）：轉換上限掉到很低。
      這正好解釋了 Ch12 的光觸媒為什麼只能用紫外光——而紫外光只占太陽光約 4%。</li>
    <li>切換「照明技術」：白熾燈約 15 lm/W，LED 超過 120 lm/W。
      看「每年每盞省電」——一盞燈看起來不多，乘上全國上億盞就是一座電廠。</li>
    <li>把「稀土回收率」從 1% 拉到 90%，看供應風險指標怎麼下降。</li>
  </ol>
  <div class="note leaf">
    <strong>為什麼能隙太大或太小都不好？</strong><br>
    能隙<strong>太大</strong>：只有高能量的光子（藍紫光）能激發電子，紅光與紅外光完全浪費。<br>
    能隙<strong>太小</strong>：什麼光都吸得到，但每個光子多出來的能量會變成熱（熱化損失）。<br>
    兩種損失一升一降，交會處就是最佳能隙。這是純粹的量子力學推出來的工程結論。
  </div>

  <h4>LED：一個能隙改變一個產業</h4>
  <p>
    藍光 LED 的關鍵材料是 GaN（能隙 3.40 eV）。在它被做出來之前，紅光與綠光 LED 已存在數十年，
    但沒有藍光就無法合成白光。2014 年的諾貝爾物理獎正是頒給藍光 LED 的發明者。
  </p>
  <ul>
    <li>照明約占全球用電的 <strong>15%</strong>，全面 LED 化可省下其中的一大半。</li>
    <li>LED <strong>不含汞</strong>，取代含汞的省電燈泡（螢光燈），同時符合原則 #3（低毒性）與 #4（更安全的產品）。</li>
    <li>LED 壽命長（數萬小時），減少更換與廢棄物（原則 #1）。</li>
  </ul>

  <h4>🌿 稀土：綠色科技的阿基里斯腱</h4>
  <p>
    在週期表上點鑭系（第 8 列那一排）——這些元素是綠色科技的隱形骨幹：
  </p>
  <table class="data">
    <thead><tr><th>元素</th><th>用途</th><th>為什麼難取代</th></tr></thead>
    <tbody>
      <tr><td>Nd 釹、Dy 鏑</td><td>風力發電機與電動車的永磁馬達</td><td>4f 電子提供極強的磁矩</td></tr>
      <tr><td>Eu 銪、Tb 鋱、Y 釔</td><td>LED 與螢光體的紅／綠發光</td><td>4f–4f 躍遷給出極純的發光波長</td></tr>
      <tr><td>La 鑭、Ce 鈰</td><td>石油裂解觸媒、汽車觸媒轉化器</td><td>可變氧化態、儲放氧能力強</td></tr>
    </tbody>
  </table>
  <div class="note warn">
    稀土的問題不是「稀少」（地殼含量其實不低），而是：<br>
    ① <strong>分離極困難</strong>——鑭系元素化學性質太像（4f 電子被外層遮蔽），
    需要上百級的溶劑萃取，能耗與廢液量都很大；<br>
    ② <strong>開採伴隨放射性</strong>——礦源常含釷、鈾；<br>
    ③ <strong>供應高度集中</strong>，且全球實際回收率長期低於 <strong>1%</strong>。<br>
    這使得「關鍵原料永續」成為綠色化學的新戰場：原則 #1（預防廢棄物）在這裡的意思是
    <strong>把用過的磁鐵與螢光粉當成礦源</strong>——又回到 Ch2 的都市採礦。
  </div>

  <h4>對應的綠色化學原則</h4>
  <ul>
    <li><strong>原則 #6 能源效率設計</strong>：選對能隙＝把同樣的陽光轉換成更多電力；LED 照明省電。</li>
    <li><strong>原則 #4 設計更安全的化學品</strong>：LED 取代含汞螢光燈；CdTe 太陽能電池的鎘則帶來新的權衡。</li>
    <li><strong>原則 #1 預防廢棄物</strong>：稀土回收、光電板的循環設計。</li>
    <li><strong>原則 #7 使用可再生原料</strong>：太陽能本身就是最徹底的可再生能源。</li>
  </ul>

  <h4>🏞 在地連結：花蓮的光與能源</h4>
  <p>
    花蓮日照條件不錯、空氣品質佳（懸浮微粒少 → 直射日照衰減小），太陽光電有一定潛力；
    但同時是農業與觀光縣，土地利用必須謹慎，因此<strong>屋頂型光電</strong>與
    <strong>農電共生</strong>（在不影響作物的前提下架設高透光模組）比地面型更合適。
  </p>
  <p>
    這裡有一個漂亮的化學連結：作物行光合作用主要利用<strong>藍光與紅光</strong>，
    對綠光的利用效率較低（所以葉子看起來是綠的）。
    因此若使用具<strong>波長選擇性</strong>的半透明光電模組（讓紅藍光透過、吸收其他波段），
    理論上可以同時發電與種植——而這件事能不能成立，完全取決於材料的<strong>能隙與吸收光譜</strong>。
    也就是說，這一章開頭那些看似抽象的軌域與能階，最後決定的是花蓮一塊農地能不能同時長稻子與發電。
  </p>

  <div class="note leaf">
    <strong>本章綠色化學占比自評：</strong>綠色情境為完整可互動模擬（7 個可調參數，含材料能隙、照明技術與回收率）；

  </div>

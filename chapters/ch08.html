<template id="tpl-concept">
  <h3>一、鍵長不是被規定的，是被「談」出來的</h3>
  <p>
    在畫面上左右拖曳（或拉滑桿），你會看到勢能曲線上的黃點跟著跑。這條曲線只有一個訊息：
    <strong>兩顆原子靠得太近會互斥、離得太遠會互相吸引，中間有一個位能最低的位置。</strong>
    那個最低點就是<strong>平衡鍵長 r₀</strong>。
  </p>
  <ul>
    <li><strong>r &lt; r₀（斥力區）</strong>：兩個原子核都是正電，靠太近時核—核排斥壓過一切，位能急速衝高。</li>
    <li><strong>r = r₀</strong>：吸引與排斥剛好平衡，位能最低，系統最穩定。</li>
    <li><strong>r &gt; r₀</strong>：吸引力仍在，但隨距離減弱；把 r 拉到很大時位能趨近 0，代表兩個原子已經分開。</li>
  </ul>
  <div class="formula">
    最低點到 0 的深度就是<span data-term="解離能">解離能</span> D<sub>e</sub>——打斷這個鍵需要的能量。<br>
    本頁曲線採 Morse 位能：<code>V(r) = D<sub>e</sub>[(1 − e<sup>−a(r−r₀)</sup>)² − 1]</code>，
    其中 r₀ 與 D<sub>e</sub> 使用實測值。
    <span class="teacher-only">形狀參數 a 為教學用取值（存於 <code>assets/js/sim/ch08.js</code> 的 <code>MORSE_A</code>），
    實際上可由振動波數 ωₑ 推得。</span>
  </div>

  <h4>二、從共價到離子，是連續的光譜</h4>
  <p>
    依序切換 H–H → H–Cl → H–F → Na–Cl，注意三件事同時在變：
  </p>
  <table class="data">
    <thead><tr><th>分子</th><th>ΔEN</th><th>偶極矩 μ (D)</th><th>離子性</th></tr></thead>
    <tbody>
      <tr><td>H–H</td><td>0</td><td>0</td><td>0%（純共價）</td></tr>
      <tr><td>H–Cl</td><td>0.96</td><td>1.08</td><td>約 20%</td></tr>
      <tr><td>H–F</td><td>1.78</td><td>1.83</td><td>約 55%</td></tr>
      <tr><td>Na–Cl（氣態分子）</td><td>2.23</td><td>9.00</td><td>約 71%</td></tr>
    </tbody>
  </table>
  <p style="margin-top:.6rem">
    電子雲的顏色梯度就是這件事的視覺化：ΔEN = 0 時電子雲左右對稱；
    ΔEN 越大，電子雲越明顯偏向<span data-term="電負度">電負度</span>大的那一端，
    <span data-term="偶極矩">偶極矩</span>箭頭也跟著變長。
  </p>
  <div class="note">
    <strong>沒有「純粹的離子鍵」，也沒有「絕對的共價鍵」。</strong>
    課本把它們分成兩章講是為了方便，但真實世界是一條連續的光譜。
    離子性百分比用的是鮑林的經驗式 <code>1 − e^(−0.25·ΔEN²)</code>。
  </div>

  <h4>三、Born–Haber：離子固體為什麼穩定？</h4>
  <p>
    把分子切到 <strong>NaCl</strong>，右下角會列出完整的 Born–Haber 循環。
    請特別注意一件反直覺的事：<strong>前四個步驟有三個是吸熱的</strong>——
    把鈉變成氣態要吸熱、把電子拔掉要吸熱、把 Cl₂ 拆開也要吸熱。
  </p>
  <p>
    唯一大幅放熱的是最後一步：氣態 Na⁺ 與 Cl⁻ 聚成晶體，放出 <strong>−787 kJ/mol</strong> 的
    <span data-term="晶格能">晶格能</span>。
    <strong>是晶格能撐起了整個離子化合物的穩定性</strong>，不是「鈉很想給電子、氯很想拿電子」這種擬人化說法。
  </p>
</template>

<template id="tpl-green">
  <h3>設計一個鍵，就是決定它幾百年後在哪裡</h3>
  <p>
    綠色化學<strong>原則 #10「可分解性設計」</strong>要求：化學產品在功能結束後，
    應能分解成無害物質，不在環境中累積。
    這條原則的實作層次不在回收廠，而在<strong>分子設計的當下</strong>——你選了哪一種鍵，
    就決定了它在環境中的命運。
  </p>

  <h4>🌿 綠色情境怎麼玩</h4>
  <ol>
    <li><strong>選 PE、環境選「海水」、時間拉到 24 個月。</strong>剩餘質量幾乎沒動。</li>
    <li><strong>切到 PLA（聚乳酸），環境仍是海水。</strong>你會發現……它也幾乎不分解！</li>
    <li><strong>把環境切到「工業堆肥」。</strong>PLA 的曲線立刻俯衝——半衰期從好幾年掉到幾週。</li>
    <li><strong>切到 PHA。</strong>它在海水中也能分解，這是它與 PLA 最關鍵的差別。</li>
    <li><strong>最後比較「尿素—甲醛膠」與「貽貝仿生膠」的毒性與水下黏著強度。</strong></li>
  </ol>
  <div class="note warn">
    第 2、3 步是本章最重要的一課：<strong>「生物可分解」不是材料的絕對屬性，而是「材料 × 環境」的組合。</strong>
    PLA 需要工業堆肥的 58 °C 與高微生物活性才會快速水解；丟進海裡它跟一般塑膠差別有限。
    許多「可分解餐具」的環境宣稱之所以有爭議，原因就在這裡。
  </div>

  <h4>化學上的差別在哪裡？</h4>
  <div class="compare">
    <div class="c-old">
      <h5>🏭 聚乙烯 PE：C–C 主鏈</h5>
      <ul>
        <li>主鏈全是 <strong>C–C 與 C–H</strong> 鍵，非極性、鍵能高（C–C 347 kJ/mol）</li>
        <li>碳上沒有部分正電荷，<strong>水分子無從攻擊</strong></li>
        <li>沒有酵素演化出來能辨識它（自然界沒有這種結構）</li>
        <li>結果：耐用、便宜、無所不在——也在環境中存續數百年</li>
      </ul>
    </div>
    <div class="c-new">
      <h5>🌿 PLA / PHA：酯鍵 –COO– 主鏈</h5>
      <ul>
        <li>酯鍵的<strong>羰基碳帶部分正電</strong>（C=O 使電子往氧偏）</li>
        <li>水分子的氧（親核基）可以攻擊這個碳 → <strong>水解斷鏈</strong></li>
        <li>自然界大量存在酯鍵（油脂、聚酯），因此有現成的酯酶能分解它</li>
        <li>PHA 由微生物直接合成，在海水中也能被分解</li>
      </ul>
    </div>
  </div>
  <p>
    這就是「可分解性設計」的分子層次意義：<strong>在主鏈上放一個可被水或酵素攻擊的官能基</strong>。
    同樣的邏輯也用在可分解農藥、可分解界面活性劑與可分解醫材上。
  </p>

  <h4>🦪 仿生黏著：貽貝教我們的事</h4>
  <p>
    貽貝（淡菜）能在<strong>波浪拍打的濕滑岩石</strong>上把自己黏住幾個月不掉。
    這件事在材料科學上非常困難——因為水會擠進界面，破壞黏著。
    貽貝的答案藏在足絲蛋白裡一個特別的胺基酸：<strong>DOPA（3,4-二羥基苯丙胺酸）</strong>，
    它帶有<strong>兒茶酚</strong>（catechol，鄰位雙羥基苯）基團。
  </p>
  <ul>
    <li>兩個相鄰的 –OH 可以與礦物表面的 <strong>Fe³⁺、Ti⁴⁺ 等金屬離子形成雙牙配位</strong>，鍵結強且可逆。</li>
    <li>兒茶酚能與表面形成<strong>氫鍵</strong>，並把界面的水分子擠開。</li>
    <li>氧化成醌之後可與蛋白質交聯，形成硬化的黏著層。</li>
  </ul>
  <div class="compare">
    <div class="c-old">
      <h5>🏭 尿素—甲醛膠（UF）</h5>
      <ul>
        <li>木質板材最常用的膠，便宜、黏得牢</li>
        <li>靠亞甲基橋 –CH₂– 交聯</li>
        <li><strong>會持續緩慢釋出甲醛</strong>——IARC 第 1 類致癌物</li>
        <li>室內空氣污染的主要來源之一</li>
      </ul>
    </div>
    <div class="c-new">
      <h5>🌿 貽貝仿生黏著劑</h5>
      <ul>
        <li>以兒茶酚基團取代甲醛交聯</li>
        <li><strong>無甲醛釋放</strong>，且可在<strong>潮濕環境</strong>下作用</li>
        <li>原料可由生物發酵取得（原則 #7 可再生原料）</li>
        <li>應用：無甲醛木質板材、醫用組織黏合、水下修補</li>
        <li>限制：目前成本較高、大規模量產仍在發展</li>
      </ul>
    </div>
  </div>

  <h4>對應的綠色化學原則</h4>
  <ul>
    <li><strong>原則 #10 可分解性設計</strong>：在主鏈放進可水解的酯鍵。</li>
    <li><strong>原則 #3 低毒性合成</strong>與<strong>原則 #4 設計更安全的化學品</strong>：以兒茶酚取代甲醛。</li>
    <li><strong>原則 #7 使用可再生原料</strong>：PLA 來自玉米／甘蔗的乳酸，PHA 由微生物合成。</li>
    <li><strong>原則 #5 更安全的溶劑</strong>：仿生黏著在水中作用，不需有機溶劑。</li>
  </ul>

  <h4>🏞 在地連結：花蓮的海與木</h4>
  <p>
    <strong>（一）海洋廢棄物。</strong>花蓮的海岸線長、洋流帶來的漂流垃圾以塑膠為大宗。
    上面的模擬告訴我們一件不太舒服的事實：即使把常見的「可分解塑膠」丟進海裡，
    也不會像廣告說的那樣消失。真正能在海水中分解的是 <strong>PHA</strong> 這一類材料，
    而它目前的產能與成本都還不足以取代 PE。<strong>誠實面對限制，是綠色化學的一部分。</strong>
  </p>
  <p>
    <strong>（二）木質產業與室內空氣。</strong>花蓮有相當規模的木作與家具產業。
    無甲醛膠（包括仿生黏著劑與大豆蛋白基膠）能直接改善室內空氣品質，
    這是原則 #4「設計更安全的化學品」最貼近生活的應用——
    因為受益的是每天待在那個房間裡的人。
  </p>
  <p>
    <strong>（三）貽貝與養殖。</strong>台灣東部海域的貝類養殖與潮間帶生態，正是這個仿生靈感的來源。
    仿生化學提醒我們：<strong>在發明新分子之前，先看看已經演化了幾億年的答案。</strong>
  </p>

  <div class="note leaf">
    <strong>本章綠色化學占比自評：</strong>綠色情境為完整可互動模擬（4 個可調參數 × 5 種材料 × 3 種環境）；

  </div>
</template>

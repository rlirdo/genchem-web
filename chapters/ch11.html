<template id="tpl-concept">
  <h3>一、依數性：只數人頭，不問是誰</h3>
  <p>
    <span data-term="依數性">依數性</span>（colligative properties）是溶液性質裡最反直覺的一組：
    <strong>它們只跟溶質的「粒子數」有關，跟溶質是什麼完全無關。</strong>
  </p>
  <p>
    請做這個實驗：把濃度固定在 1.0 mol/L，然後把溶質從<strong>葡萄糖</strong>切到 <strong>NaCl</strong> 再切到 <strong>CaCl₂</strong>。
    濃度數字完全沒變，但滲透壓與蒸氣壓下降都變成 2 倍、3 倍。
  </p>
  <div class="formula">
    這個倍數叫<strong>凡特荷夫因子 i</strong>：<br>
    葡萄糖 → 1 個分子（i = 1）　NaCl → Na⁺ + Cl⁻（i ≈ 2）　CaCl₂ → Ca²⁺ + 2Cl⁻（i ≈ 3）<br>
    <code>π = i · M · R · T</code>　<code>ΔT_b = K_b · i · m</code>　<code>ΔT_f = K_f · i · m</code>
  </div>

  <h4>二、蒸氣壓為什麼會下降？</h4>
  <p>
    在模組 A 的畫面裡，橘色的溶質粒子會擠在液面上。水分子要蒸發，必須<strong>剛好位在表面</strong>
    而且動能夠大。溶質占掉了一部分表面位置，能逃出去的水分子就變少了——蒸氣壓因此下降。
  </p>
  <div class="formula">
    <span data-term="拉午耳定律">拉午耳定律</span>：<code>P = X_溶劑 · P°</code><br>
    25 °C 時純水的飽和蒸氣壓 P° = 23.76 torr。溶劑莫耳分率越小，溶液蒸氣壓越低。
  </div>
  <p>
    這也順帶解釋了另外兩件事：蒸氣壓變低 → 要更高的溫度才能讓蒸氣壓等於大氣壓 → <strong>沸點上升</strong>；
    而溶質擾亂了冰晶的形成 → <strong>凝固點下降</strong>（這就是為什麼下雪的地方要撒鹽）。
  </p>

  <h4>三、滲透壓：水想去粒子多的那一邊</h4>
  <p>
    切到模組 B。半透膜只讓水分子通過，橘色的溶質被完全擋住。
    水分子其實是<strong>雙向</strong>穿越的——但因為濃側的水分子「濃度」比較低，
    淨結果是水往濃側跑，把液面推高。要阻止這個淨流動所需的壓力，就是<strong>滲透壓 π</strong>。
  </p>
  <div class="note">
    海水（約 0.6 mol/L NaCl、i ≈ 2）在 25 °C 的滲透壓約 <strong>27 atm</strong>。
    把「外加壓力」拉到超過這個值，你會看到水流方向<strong>反轉</strong>——這就是
    <span data-term="逆滲透">逆滲透</span>（RO），也是全世界一半以上淡化水的來源。
  </div>
  <div class="formula teacher-only">
    <strong>教師模式：驗算</strong><br>
    π = i·M·R·T = 2 × 0.55 mol/L × 0.08206 L·atm/(mol·K) × 298 K ≈ 26.9 atm ≈ 27 bar。<br>
    海水的實際滲透莫耳濃度約 1.1 osmol/L（含 Mg²⁺、SO₄²⁻ 等），與此估算一致。
  </div>
</template>

<template id="tpl-green">
  <h3>把 π 從課本搬到淡化廠</h3>
  <p>
    上一節算出的那個 27 atm，不只是一個考題答案——它是全世界海水淡化廠<strong>每天必須克服的門檻</strong>。
    切到綠色情境，你手上就是一座 RO 廠的控制盤。
  </p>

  <h4>🌿 四個一定要做的實驗</h4>
  <ol>
    <li><strong>把「施加壓力」降到 20 bar。</strong>面板會顯示「壓力低於滲透壓，完全無法產水」。
      這是滲透壓最直接的工程意義：它是一道<strong>硬門檻</strong>。</li>
    <li><strong>把壓力慢慢往上加。</strong>一旦超過門檻就開始產水，但能耗也跟著線性上升。
      找出「剛好能產水」的壓力，能耗最低。</li>
    <li><strong>把「產水回收率」從 45% 拉到 65%。</strong>看兩件事同時發生：
      濃鹽水鹽度飆到 100 g/kg 以上（海水本身才 35），而且需要的壓力也變高——
      因為<strong>濃側的滲透壓隨著濃縮而上升</strong>。</li>
    <li><strong>切到「半鹹水」。</strong>滲透壓低很多，能耗也低很多。
      這解釋了為什麼內陸半鹹水淡化的成本遠低於海水淡化。</li>
  </ol>

  <h4>為什麼 RO 打敗了蒸餾？</h4>
  <table class="data">
    <thead><tr><th>技術</th><th>能耗 (kWh/m³)</th><th>原理</th></tr></thead>
    <tbody>
      <tr><td>熱力學理論最小值</td><td>約 1.06</td><td>分離所需的最小功（35 g/kg、50% 回收率）</td></tr>
      <tr><td>逆滲透 RO</td><td>約 3–4</td><td>加壓把水擠過膜，<strong>水不需要相變</strong></td></tr>
      <tr><td>多級閃化蒸餾 MSF</td><td>約 10–15（含熱能換算）</td><td>把水汽化再冷凝，要付出汽化熱</td></tr>
    </tbody>
  </table>
  <p style="margin-top:.6rem">
    關鍵差別在<strong>相變</strong>。水的汽化熱是 40.7 kJ/mol，非常大；
    RO 完全繞過這件事，只付「把水擠過膜」的機械功。
    這是綠色化學<strong>原則 #6</strong>最漂亮的工程實例：
    <strong>換一個物理路徑，就少花一個數量級的能量。</strong>
  </p>
  <div class="note warn">
    但 RO 也不是沒有代價：<strong>濃鹽水（brine）</strong>。
    每產 1 m³ 淡水，就會產生約 1–1.5 m³ 鹽度加倍的濃排水。
    它密度高、會沉在海底，對底棲生物與海草床有實質衝擊；
    若含前處理藥劑與抗垢劑，問題更複雜。
    <strong>零液體排放（ZLD）</strong>把濃鹽水繼續濃縮到析出固體鹽，
    甚至回收其中的鎂、鋰等元素——這是把「廢棄物」變回「原料」（原則 #1），
    代價則是更高的能耗。天下沒有白吃的午餐，只有想清楚的取捨。
  </div>

  <h4>對應的綠色化學原則</h4>
  <ul>
    <li><strong>原則 #6 能源效率設計</strong>：以壓力驅動取代相變，能耗差一個數量級。</li>
    <li><strong>原則 #5 更安全的溶劑與助劑</strong>：整個程序以水為介質，不使用有機溶劑。</li>
    <li><strong>原則 #1 預防廢棄物</strong>：ZLD 與濃鹽水的資源化（提取鎂、鋰、溴）。</li>
    <li><strong>原則 #11 即時分析防污染</strong>：線上監測導電度與膜壓差，及早發現結垢與破膜。</li>
  </ul>

  <h4>🏞 在地連結：花蓮深層海水</h4>
  <p>
    花蓮擁有台灣少數的<strong>深層海水</strong>取水條件：離岸不遠就有陡降的海底地形，
    可以在 600–800 公尺深處取水。深層海水有三個化學上的特點：
  </p>
  <ul>
    <li><strong>低溫穩定</strong>（約 5–10 °C）：溫度低代表細菌活性低，也代表可以直接作為冷能利用（海洋溫差發電、空調冷卻）。</li>
    <li><strong>潔淨</strong>：位於透光層之下，浮游生物與有機污染物少，前處理負擔小。</li>
    <li><strong>富含礦物質</strong>：鎂、鉀、鋅等含量穩定。這使得「淡化」不再是唯一目的——
      濃縮後的礦物質本身就是產品（食品級鎂、深層海水飲品、養殖用水）。</li>
  </ul>
  <div class="note leaf">
    這正是綠色化學的思考方式：<strong>不要問「怎麼處理廢棄物」，要問「為什麼它是廢棄物」。</strong>
    在傳統海水淡化廠，濃鹽水是要花錢排掉的負擔；
    在深層海水產業，同一股濃縮液是要賣錢的原料。
    差別不在化學，在<strong>設計</strong>。
  </div>
  <p>
    另外值得一提：花蓮水資源其實相對豐沛，本身未必需要大規模海水淡化。
    這一頁的重點不是主張花蓮該蓋淡化廠，而是說明<strong>同一組依數性公式，
    如何同時解釋一杯鹽水、一顆細胞、與一座工廠的電費單</strong>。
  </p>

  <div class="note leaf">
    <strong>本章綠色化學占比自評：</strong>綠色情境為完整可互動模擬（6 個可調參數，含壓力、回收率與水源）；

  </div>
</template>
